name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install AppImage tooling
        run: |
          sudo apt-get update && sudo apt-get install -y squashfs-tools
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o /tmp/appimagetool
          chmod +x /tmp/appimagetool && sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Build portable assets
        run: ./scripts/release.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-assets
          path: |
            dist/CV++-windows-amd64.zip
            dist/CV++-linux-amd64.AppImage
            dist/CV++-linux-amd64.tar.gz
          if-no-files-found: error
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and verify macOS application
        run: ./scripts/package-macos.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-asset
          path: dist/CV++-macos-arm64.zip
          if-no-files-found: error
  release:
    needs: [portable, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify assets and generate checksums
        run: |
          unzip -t 'dist/CV++-macos-arm64.zip'
          cd dist
          sha256sum CV++-* > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            CV++ is not notarized by Apple or signed with a paid Developer ID. See the README for one-time Windows SmartScreen and macOS Gatekeeper instructions.
            CI never runs real ERP authentication and no credentials are included.
